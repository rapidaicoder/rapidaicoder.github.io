  reply: "Дипломын ажил файл хамтрагч дээр нээлттэй. Найруулгын шинжээч бүлгийн тэмдэглэл үлдээлээ. Хуваалцсаны дараа хөтлөгч тэмдэглэл бүрийг зөвшөөрөх эсвэл үл хэрэгсэж, дараа нь хариу бүлэгт бичигдэнэ."
