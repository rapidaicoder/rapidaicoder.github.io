      text: "Найруулгын шинжээч хэл ба бүтцийг уншина. Нэхэмжлэл хэвээрээ."
    - kicker: Хөтлөгчийн хяналт
      text: "Тэмдэглэл бүрийг зөвшөөрөх эсвэл үл хэрэгсэнэ. Дараа нь бүлэг хариуг уншина."
    - kicker: Hub хуваалцалт
      text: "Алсын хяналт Hub-ын алсын сесс дээр, ширээнээс хол үргэлжилнэ."
